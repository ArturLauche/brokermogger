version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
    ignore:
      # Transitive-only packages that Dependabot Updates tried to bump without a
      # direct pin. Keep them out of the noise until they are direct deps.
      - dependency-name: effect
      - dependency-name: deepmerge-ts
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
