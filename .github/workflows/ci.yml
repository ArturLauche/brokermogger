# CI needs no GitHub secrets. Test cryptography keys and the Postgres service
# are defined here so a fresh fork can run the workflow.
#
# Required service: postgres:16 (job service container on 127.0.0.1:5433).
# Node version comes from .nvmrc (pinned 22.23.2; jsdom engines ^22.22.2 || ^24.15.0 || >=26).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brokermogger
          POSTGRES_PASSWORD: brokermogger
          POSTGRES_DB: brokermogger_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brokermogger -d brokermogger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://brokermogger:brokermogger@127.0.0.1:5433/brokermogger_test?schema=public
      TEST_DATABASE_URL: postgresql://brokermogger:brokermogger@127.0.0.1:5433/brokermogger_test?schema=public
      LOG_LEVEL: error
      AUTH_SECRET: test-auth-secret-000000000000000000000000
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      ENCRYPTION_KEYS: v1:dGVzdC1lbmNyeXB0aW9uLWtleS1kby1ub3QtdXNlAAA=
      ENCRYPTION_ACTIVE_KEY_ID: v1
      BLIND_INDEX_KEY: dGVzdC1ibGluZC1pbmRleC1rZXktZG8tbm90LXVzZQA=
      EMAIL_PROVIDER: mock
      EMAIL_FROM: Brokermogger <privacy@example.invalid>
      ALLOW_EXTERNAL_SENDING: "false"
      STORAGE_BACKEND: memory
      APP_ENV: development
      APP_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development
          npm_config_engine_strict: "true"
      - run: npx prisma generate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:dependencies
      - run: npx prisma migrate deploy
      - run: npm run check:env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
      - run: npm run prepare:standalone
      - name: Prepare isolated browser database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://brokermogger:brokermogger@127.0.0.1:5433/brokermogger_test?schema=bm_e2e_workflows
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: production
          APP_ENV: staging
          E2E_BASE_URL: http://127.0.0.1:3000
          HOSTNAME: 127.0.0.1
          PORT: "3000"
          LOG_LEVEL: error
          # Integration fixtures may leave eligible jobs. Browser worker claims
          # exercise production queue ordering in their own freshly migrated schema.
          DATABASE_URL: postgresql://brokermogger:brokermogger@127.0.0.1:5433/brokermogger_test?schema=bm_e2e_workflows
          TEST_DATABASE_URL: postgresql://brokermogger:brokermogger@127.0.0.1:5433/brokermogger_test?schema=bm_e2e_workflows
          # Browser-driven leased jobs and the standalone server are separate
          # processes, so encrypted objects must use the same persistent store.
          STORAGE_BACKEND: local
          STORAGE_LOCAL_DIR: ${{ github.workspace }}/.tmp/e2e-storage
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Verify separate runtimes and encrypted shared storage
        run: bash scripts/docker-smoke.sh
