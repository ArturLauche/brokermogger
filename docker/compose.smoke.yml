# Only scripts/docker-smoke.sh uses this isolated stack. No production volumes.
x-runtime: &runtime
  NODE_ENV: production
  APP_ENV: staging
  APP_BASE_URL: http://127.0.0.1:3099
  AUTH_URL: http://127.0.0.1:3099
  AUTH_TRUST_HOST: "true"
  DATABASE_URL: postgresql://brokermogger:${POSTGRES_PASSWORD}@postgres:5432/${SMOKE_DATABASE:-brokermogger_smoke_test}?schema=public
  AUTH_SECRET: ${AUTH_SECRET:?generated by smoke script}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?generated by smoke script}
  ENCRYPTION_ACTIVE_KEY_ID: smoke
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?generated by smoke script}
  EMAIL_PROVIDER: mock
  EMAIL_FROM: Brokermogger <privacy@example.invalid>
  ALLOW_EXTERNAL_SENDING: "false"
  STORAGE_BACKEND: local
  STORAGE_LOCAL_DIR: /data/objects
  MOCK_EMAIL_DIR: /data/mail
  JOB_POLL_INTERVAL_MS: "100"
  LOG_LEVEL: warn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brokermogger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by smoke script}
      POSTGRES_DB: brokermogger_smoke_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokermogger -d brokermogger_smoke_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://brokermogger:${POSTGRES_PASSWORD}@postgres:5432/${SMOKE_DATABASE:-brokermogger_smoke_test}?schema=public
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: { context: .., dockerfile: docker/Dockerfile, target: app }
    environment: *runtime
    ports: ["127.0.0.1:3099:3000"]
    volumes: [private-storage:/data/objects, mock-mail:/data/mail]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    environment: *runtime
    volumes: [private-storage:/data/objects, mock-mail:/data/mail]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  private-storage:
  mock-mail:
