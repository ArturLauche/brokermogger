# Production-style compose. Fill secrets via environment or an uncommitted .env.
#
#   docker compose -f docker-compose.prod.yml up -d --build

name: brokermogger-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brokermogger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: brokermogger
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokermogger -d brokermogger"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL using postgres as the host, URL-encoded credentials and an explicit sslmode (sslmode=disable for this private network)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    ports:
      # Host-local reverse proxy only. Do not expose this port to untrusted clients.
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      APP_ENV: production
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-none}
      ALLOW_SHARED_AUTH_NETWORK_BUCKET: ${ALLOW_SHARED_AUTH_NETWORK_BUCKET:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL using postgres as the host, URL-encoded credentials and an explicit sslmode (sslmode=disable for this private network)}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      ALLOW_EXTERNAL_SENDING: ${ALLOW_EXTERNAL_SENDING:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/objects
      MOCK_EMAIL_DIR: /data/mail
    volumes:
      - private-storage:/data/objects
      - mock-mail:/data/mail
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      WORKER_HEALTH_FILE: /tmp/brokermogger-worker-id
      APP_ENV: production
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-none}
      ALLOW_SHARED_AUTH_NETWORK_BUCKET: ${ALLOW_SHARED_AUTH_NETWORK_BUCKET:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL using postgres as the host, URL-encoded credentials and an explicit sslmode (sslmode=disable for this private network)}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      ALLOW_EXTERNAL_SENDING: ${ALLOW_EXTERNAL_SENDING:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/objects
      MOCK_EMAIL_DIR: /data/mail
    volumes:
      - private-storage:/data/objects
      - mock-mail:/data/mail
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  private-storage:
  mock-mail:
